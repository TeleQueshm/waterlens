<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vivaSTAR - Water Potability Prediction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --vibrancy-blur: blur(40px) saturate(180%);
    }

    body {
      background: url('../static/pexels-pixabay-46253.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: 'SF Pro Display', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }

    /* Main Window */
    .vision-container {
      display: flex;
      width: 100%;
      max-width: 1000px;
      height: 750px;
      background: var(--glass-bg);
      backdrop-filter: var(--vibrancy-blur);
      -webkit-backdrop-filter: var(--vibrancy-blur);
      border: 1px solid var(--glass-border);
      border-radius: 45px;
      box-shadow: 0 50px 100px rgba(0,0,0,0.4);
      overflow: hidden;
      position: relative;
      
    }

    /* Side Navigation Bar */
    .vision-sidebar {
      width: 80px;
      background: rgba(0, 0, 0, 0.15);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      gap: 25px;
    }

    .nav-item {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 1.2rem;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      transform: scale(1.1);
    }

    /* Main Content Area */
    .vision-content {
      flex: 1;
      padding: 50px;
      overflow-y: auto;
      scrollbar-width: none; /* Hide scrollbar Firefox */
    }

    .vision-content::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome/Safari */

    .header-section {
      margin-bottom: 40px;
            color: rgb(0, 0, 0);
    }

    .header-section h1 {
      font-weight: 600;
      letter-spacing: -1px;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .header-section p {
      color: rgba(0, 0, 0, 0.5);
      font-size: 1.1rem;
    }

    /* Form Styling */
    .form-label {
      font-weight: 500;
      font-size: 0.9rem;
            color: rgb(0, 0, 0);
      margin-bottom: 8px;
      margin-left: 5px;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.39);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: rgb(0, 0, 0);
      padding: 14px 18px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
            color: rgb(0, 0, 0);
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    /* Vision Button */
    .btn-vision {
      background: white;
      color: black;
      font-weight: 600;
      border-radius: 30px;
      padding: 14px 40px;
      border: none;
      transition: all 0.3s ease;
      margin-top: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .btn-vision:hover {
      background: #1f79da;
      transform: scale(1.03);
      color: black;
    }

    /* Glow Effect */
    .vision-container::after {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 45px;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent, rgba(255,255,255,0.05));
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="vision-container">
    <nav class="vision-sidebar">
      <div class="mb-5">
        <i class="fa-solid fa-droplet" style="font-size: 1.8rem; color: #00e1ff;"></i>
      </div>
      <a href="#" class="nav-item active" title="Home">
        <i class="fas fa-home"></i>
      </a>
      <a href="/table" class="nav-item" title="History">
        <i class="fas fa-chart-line"></i>
      </a>
      <a href="/info" class="nav-item" title="Settings">
        <i class="fas fa-cog"></i>
      </a>
    </nav>

    <main class="vision-content">
      <div class="header-section">
        <h1>Water Potability</h1>
        <p>AI Analysis & Quality Metrics</p>
      </div>

      <form action="/predict" method="post" class="row g-4">
        <div class="col-md-4">
          <label for="ph" class="form-label">pH Level</label>
          <input type="text" class="form-control" id="ph" name="ph" placeholder="7.0">
        </div>
        <div class="col-md-4">
          <label for="Hardness" class="form-label">Hardness</label>
          <input type="text" class="form-control" id="Hardness" name="Hardness" placeholder="204.8">
        </div>
        <div class="col-md-4">
          <label for="Solids" class="form-label">Solids</label>
          <input type="text" class="form-control" id="Solids" name="Solids" placeholder="20791">
        </div>
        
        <div class="col-md-4">
          <label for="Chloramines" class="form-label">Chloramines</label>
          <input type="text" class="form-control" id="Chloramines" name="Chloramines" placeholder="7.3">
        </div>
        <div class="col-md-4">
          <label for="Sulfate" class="form-label">Sulfate</label>
          <input type="text" class="form-control" id="Sulfate" name="Sulfate" placeholder="368.5">
        </div>
        <div class="col-md-4">
          <label for="Conductivity" class="form-label">Conductivity</label>
          <input type="text" class="form-control" id="Conductivity" name="Conductivity" placeholder="564.3">
        </div>

        <div class="col-md-4">
          <label for="Organic_carbon" class="form-label">Organic Carbon</label>
          <input type="text" class="form-control" id="Organic_carbon" name="Organic_carbon" placeholder="10.37">
        </div>
        <div class="col-md-4">
          <label for="Trihalomethanes" class="form-label">Trihalomethanes</label>
          <input type="text" class="form-control" id="Trihalomethanes" name="Trihalomethanes" placeholder="86.99">
        </div>
        <div class="col-md-4">
          <label for="Turbidity" class="form-label">Turbidity</label>
          <input type="text" class="form-control" id="Turbidity" name="Turbidity" placeholder="2.96">
        </div>

        <div class="col-12 mt-5">
          <button type="submit" class="btn btn-vision w-100">
            Analyze Quality
          </button>
        </div>
      </form>
    </main>
  </div>

</body>
</html>
